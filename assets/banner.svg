<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#051026"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bg)" rx="16"/>

  <!-- Dynamic Grid Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <path d="M 0 50 L 1200 50 M 0 100 L 1200 100 M 0 150 L 1200 150 M 0 200 L 1200 200 M 0 250 L 1200 250 M 0 300 L 1200 300 M 0 350 L 1200 350" />
    <path d="M 100 0 L 100 400 M 200 0 L 200 400 M 300 0 L 300 400 M 400 0 L 400 400 M 500 0 L 500 400 M 600 0 L 600 400 M 700 0 L 700 400 M 800 0 L 800 400 M 900 0 L 900 400 M 1000 0 L 1000 400 M 1100 0 L 1100 400" />
  </g>

  <!-- Animated Electricity Lines -->
  <g stroke-linecap="round">
    <!-- Transmission Line 1 -->
    <path d="M 100 260 L 300 200 L 500 240 L 700 160 L 900 220 L 1100 180" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.5"/>
    <path d="M 100 260 L 300 200 L 500 240 L 700 160 L 900 220 L 1100 180" fill="none" stroke="url(#cyan-glow)" stroke-width="4" stroke-dasharray="30 150" filter="url(#blur-glow)">
      <animate attributeName="stroke-dashoffset" values="180;0" dur="2.5s" repeatCount="indefinite"/>
    </path>

    <!-- Transmission Line 2 -->
    <path d="M 100 140 L 350 220 L 600 130 L 850 250 L 1100 150" fill="none" stroke="#059669" stroke-width="2" opacity="0.5"/>
    <path d="M 100 140 L 350 220 L 600 130 L 850 250 L 1100 150" fill="none" stroke="url(#green-glow)" stroke-width="4" stroke-dasharray="40 160" filter="url(#blur-glow)">
      <animate attributeName="stroke-dashoffset" values="200;0" dur="3.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Animated Smart Grid Nodes -->
  <!-- Node 1 -->
  <g transform="translate(300, 200)">
    <circle r="12" fill="#0284c7" opacity="0.3">
      <animate attributeName="r" values="8;18;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" fill="#00f2fe" filter="url(#blur-glow)"/>
  </g>

  <!-- Node 2 -->
  <g transform="translate(700, 160)">
    <circle r="14" fill="#059669" opacity="0.3">
      <animate attributeName="r" values="10;22;10" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="7" fill="#34d399" filter="url(#blur-glow)"/>
  </g>

  <!-- Node 3 -->
  <g transform="translate(900, 220)">
    <circle r="12" fill="#d97706" opacity="0.3">
      <animate attributeName="r" values="8;18;8" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" fill="#fbbf24" filter="url(#blur-glow)"/>
  </g>

  <!-- Title and Badges -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Icon/Logo Glyph -->
    <text x="600" y="110" font-size="44" fill="#00f2fe" filter="url(#blur-glow)">⚡ 🌐 🔋</text>
    
    <!-- Header Title -->
    <text x="600" y="170" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="2">
      AWESOME SMART GRID MANAGEMENT
    </text>

    <!-- Subtitle -->
    <text x="600" y="215" font-size="18" font-weight="500" fill="#94a3b8" letter-spacing="1">
      Curated List of Utility SaaS Platforms • Open-Source DERMS • ADMS • SCADA • Energy Orchestration
    </text>

    <!-- Live Telemetry Status Pill -->
    <g transform="translate(450, 255)">
      <rect width="300" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="24" cy="18" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="160" y="23" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">
        GRID STATUS: OPERATIONAL &amp; OPTIMIZED
      </text>
    </g>
  </g>
</svg>
